<title id="t">Tarpon 11-weight — leader diagram</title>
<desc id="d">Leader schematic for Tarpon 11-weight: 4 ft · 40 lb Hard mono butt, then 2 ft · 20 lb Class tippet (fluorocarbon), then 1 ft · 60 lb Bite tippet (fluorocarbon).</desc>
<style>
  :root {
