<text x="258" y="884.9" class="t-end ov" text-anchor="end">POINT</text>
<text x="258" y="908.9" class="t-sub ov" text-anchor="end">The heavy fly. It sets the</text>
<text x="258" y="929.9" class="t-sub ov" text-anchor="end">depth.</text>
<text x="26" y="1002.9" class="t-cap ov" text-anchor="start">Dropper: 18–24 in above the point, on a tag or ring.</text>
<text x="26" y="1041.9" class="t-cap ov" text-anchor="start">When: Riffles, seams and pocket water where you can hold a tight</text>
<text x="26" y="1066.9" class="t-cap ov" text-anchor="start">line within a rod-and-a-half of the fish.</text>
<text x="26" y="1117.9" class="t-knot ov" text-anchor="start">Not to scale — lengths are on the labels.</text>
</svg>
