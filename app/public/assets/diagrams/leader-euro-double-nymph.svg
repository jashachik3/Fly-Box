<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1141.8591269649903" width="730" height="1141.8591269649903" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Euro double-nymph — leader diagram</title>
<desc id="d">Leader schematic for Euro double-nymph: 12 ft · 20 lb Level mono butt, then 1 ft · 12 lb Sighter — hi-vis, then 1 ft · 10 lb Sighter — contrast, then 5 ft · 5X · 5 lb Tippet.</desc>
<style>
  :root {
    --bg: #ffffff;
    --ink: #17211c;
    --ink-2: #4a5852;
    --ink-3: #5a6a63;
    --rule: #d2dad3;
    --strand-b: #14605b;
    --action: #9c4514;
    --sighter: #b8860b;
    --panel: #f7f9f6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141c18;
      --ink: #e4eae5;
      --ink-2: #a5b2ab;
      --ink-3: #7a8781;
      --rule: #263229;
      --strand-b: #5fc6b8;
      --action: #e4864b;
      --sighter: #d8a93a;
      --panel: #1a231e;
    }
  }

  text {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    fill: var(--ink);
  }
  .t-spec { font-size: 21px; font-weight: 600; }
  .t-sub { font-size: 18px; fill: var(--ink-2); }
  .t-knot { font-size: 18px; font-style: italic; fill: var(--ink-3); }
  .t-cap { font-size: 20px; fill: var(--ink-2); }
  .t-end { font-size: 17px; font-weight: 700; letter-spacing: 0.09em; fill: var(--ink-3); }
  .t-title { font-size: 30px; font-weight: 700; }
  .t-badge { font-size: 23px; font-weight: 700; fill: var(--bg); }
  .t-count { font-size: 19px; font-weight: 700; fill: var(--action); }
  /* A panel backed by a rendered image drops its own line work and keeps its
     text, numbers and arrows. Per-panel, so a half-generated set still reads. */
  .has-img .art { display: none }
</style>
