<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 971.0538238691624" width="730" height="971.0538238691624" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Dry-dropper, floating line — leader diagram</title>
<desc id="d">Leader schematic for Dry-dropper, floating line: 9 ft · 4X · 6 lb Knotless tapered leader, then 2 ft · 5X · 5 lb Tippet to dropper.</desc>
<style>
  :root {
    --bg: #ffffff;
    --ink: #17211c;
    --ink-2: #4a5852;
    --ink-3: #5a6a63;
    --rule: #d2dad3;
    --strand-b: #14605b;
    --action: #9c4514;
    --sighter: #b8860b;
    --panel: #f7f9f6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141c18;
      --ink: #e4eae5;
      --ink-2: #a5b2ab;
      --ink-3: #7a8781;
      --rule: #263229;
      --strand-b: #5fc6b8;
      --action: #e4864b;
      --sighter: #d8a93a;
      --panel: #1a231e;
    }
  }

  text {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    fill: var(--ink);
  }
  .t-spec { font-size: 21px; font-weight: 600; }
  .t-sub { font-size: 18px; fill: var(--ink-2); }
  .t-knot { font-size: 18px; font-style: italic; fill: var(--ink-3); }
  .t-cap { font-size: 20px; fill: var(--ink-2); }
  .t-end { font-size: 17px; font-weight: 700; letter-spacing: 0.09em; fill: var(--ink-3); }
  .t-title { font-size: 30px; font-weight: 700; }
  .t-badge { font-size: 23px; font-weight: 700; fill: var(--bg); }
  .t-count { font-size: 19px; font-weight: 700; fill: var(--action); }
  /* A panel backed by a rendered image drops its own line work and keeps its
     text, numbers and arrows. Per-panel, so a half-generated set still reads. */
  .has-img .art { display: none }
</style>
<rect width="730" height="971.0538238691624" fill="var(--bg)"/>
<g><g class="art">
<path d="M300,96 L300,162" fill="none" stroke="var(--ink)" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M300,206 L300,416" fill="none" stroke="var(--ink)" stroke-width="13.5" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M300,416 L300,555.1" fill="none" stroke="var(--ink)" stroke-width="12.5" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M300,555.1 L300,601.1" fill="none" stroke="var(--ink)" stroke-width="4.6" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M346,641.1 C349.3,651.4 365.3,683.4 366,703.1 C366.7,722.7 352.7,749.7 350,759.1" fill="none" stroke="var(--bg)" stroke-width="9.7" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M346,641.1 C349.3,651.4 365.3,683.4 366,703.1 C366.7,722.7 352.7,749.7 350,759.1" fill="none" stroke="var(--ink)" stroke-width="4.2" stroke-linecap="butt" stroke-linejoin="round"/>
</g></g>
<text x="26" y="42" class="t-title ov" text-anchor="start">Dry-dropper, floating line</text>
<text x="26" y="70" class="t-sub ov" text-anchor="start">4–5 wt  ·  11 ft leader  ·  2 sections</text>
<text x="258" y="130" class="t-end ov" text-anchor="end">FLY LINE</text>
<text x="258" y="156" class="t-sub ov" text-anchor="end">Floating, weight-forward</text>
<g class="ov"><ellipse cx="300" cy="173" rx="12" ry="19" fill="none" stroke="var(--ink)" stroke-width="4"/>
<ellipse cx="300" cy="195" rx="12" ry="19" fill="none" stroke="var(--ink)" stroke-width="4"/>
<path d="M288,180 A12,19 0 0 0 312,180" fill="none" stroke="var(--bg)" stroke-width="5"/></g>
<text x="336" y="190" class="t-knot ov" text-anchor="start">Loop to loop</text>
<text x="258" y="307" class="t-spec ov" text-anchor="end">9 ft · 4X · 6 lb</text>
<text x="258" y="331" class="t-sub ov" text-anchor="end">Knotless tapered</text>
<text x="258" y="353" class="t-sub ov" text-anchor="end">leader</text>
<g class="ov"><line x1="267.35" y1="269.6" x2="332.65" y2="251.60000000000002" stroke="var(--bg)" stroke-width="7"/>
<path d="M267.35,262.6 L332.65,244.60000000000002" stroke="var(--ink-3)" stroke-width="3" fill="none"/>
<path d="M267.35,276.6 L332.65,258.6" stroke="var(--ink-3)" stroke-width="3" fill="none"/></g>
<g class="ov"><circle cx="300" cy="416" r="7.5" fill="var(--bg)"/><circle cx="300" cy="416" r="5.5" fill="var(--ink)"/></g>
<text x="336" y="422" class="t-knot ov" text-anchor="start">Blood knot</text>
<text x="258" y="481.5" class="t-spec ov" text-anchor="end">2 ft · 5X · 5 lb</text>
<text x="258" y="505.5" class="t-sub ov" text-anchor="end">Tippet to dropper</text>
<g class="ov"><circle cx="300" cy="555.0538238691624" r="7.5" fill="var(--bg)"/><circle cx="300" cy="555.0538238691624" r="5.5" fill="var(--ink)"/></g>
<text x="336" y="561.1" class="t-knot ov" text-anchor="start">Pitzen knot</text>
<g transform="translate(294,601.0538238691624) scale(0.9)"><g class="art"><circle cx="0" cy="0" r="11" fill="none" stroke="var(--ink-2)" stroke-width="4.4"/>
<path d="M16.5,0 L50,0" fill="none" stroke="var(--ink-2)" stroke-width="4.4" stroke-linecap="round"/>
<path d="M50,0 C53.3,0.7 65.7,0 70,4 C74.3,8 78,19 76,24 C74,29 63.7,33.7 58,34 C52.3,34.3 45.2,29.5 42,26 C38.8,22.5 39.5,15.2 39,13" fill="none" stroke="var(--ink-2)" stroke-width="4.4" stroke-linecap="round"/></g></g>
<text x="258" y="607.1" class="t-end ov" text-anchor="end">DRY</text>
<text x="258" y="631.1" class="t-sub ov" text-anchor="end">Buoyant enough to carry the</text>
<text x="258" y="652.1" class="t-sub ov" text-anchor="end">dropper — this is the</text>
<text x="258" y="673.1" class="t-sub ov" text-anchor="end">constraint, not the</text>
<text x="258" y="694.1" class="t-sub ov" text-anchor="end">imitation.</text>
<g transform="translate(348,767.0538238691624) scale(0.62)"><g class="art"><circle cx="0" cy="0" r="11" fill="none" stroke="var(--ink-2)" stroke-width="4.4"/>
<path d="M16.5,0 L50,0" fill="none" stroke="var(--ink-2)" stroke-width="4.4" stroke-linecap="round"/>
<path d="M50,0 C53.3,0.7 65.7,0 70,4 C74.3,8 78,19 76,24 C74,29 63.7,33.7 58,34 C52.3,34.3 45.2,29.5 42,26 C38.8,22.5 39.5,15.2 39,13" fill="none" stroke="var(--ink-2)" stroke-width="4.4" stroke-linecap="round"/></g></g>
<text x="258" y="773.1" class="t-end ov" text-anchor="end">DROPPER</text>
<text x="258" y="797.1" class="t-sub ov" text-anchor="end">Off the hook bend, 18–36 in</text>
<text x="258" y="818.1" class="t-sub ov" text-anchor="end">depending on depth.</text>
<text x="26" y="871.1" class="t-cap ov" text-anchor="start">When: Shallower water, spread-out fish, or when you want the dry</text>
<text x="26" y="896.1" class="t-cap ov" text-anchor="start">to actually be eaten rather than just float.</text>
<text x="26" y="947.1" class="t-knot ov" text-anchor="start">Not to scale — lengths are on the labels.</text>
</svg>
