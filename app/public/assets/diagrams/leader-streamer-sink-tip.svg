<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 758.3486742963366" width="730" height="758.3486742963366" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Streamer, sink tip — leader diagram</title>
<desc id="d">Leader schematic for Streamer, sink tip: 3 ft · 15 lb Mono butt, then 3 ft · 10 lb Fluorocarbon tippet.</desc>
<style>
  :root {
    --bg: #ffffff;
    --ink: #17211c;
    --ink-2: #4a5852;
    --ink-3: #5a6a63;
    --rule: #d2dad3;
    --strand-b: #14605b;
    --action: #9c4514;
    --sighter: #b8860b;
    --panel: #f7f9f6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141c18;
      --ink: #e4eae5;
      --ink-2: #a5b2ab;
      --ink-3: #7a8781;
      --rule: #263229;
      --strand-b: #5fc6b8;
      --action: #e4864b;
      --sighter: #d8a93a;
      --panel: #1a231e;
    }
  }

  text {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    fill: var(--ink);
  }
  .t-spec { font-size: 21px; font-weight: 600; }
  .t-sub { font-size: 18px; fill: var(--ink-2); }
  .t-knot { font-size: 18px; font-style: italic; fill: var(--ink-3); }
  .t-cap { font-size: 20px; fill: var(--ink-2); }
  .t-end { font-size: 17px; font-weight: 700; letter-spacing: 0.09em; fill: var(--ink-3); }
  .t-title { font-size: 30px; font-weight: 700; }
  .t-badge { font-size: 23px; font-weight: 700; fill: var(--bg); }
  .t-count { font-size: 19px; font-weight: 700; fill: var(--action); }
  /* A panel backed by a rendered image drops its own line work and keeps its
     text, numbers and arrows. Per-panel, so a half-generated set still reads. */
  .has-img .art { display: none }
</style>
<rect width="730" height="758.3486742963366" fill="var(--bg)"/>
<g><g class="art">
<path d="M300,96 L300,162" fill="none" stroke="var(--ink)" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M300,206 L300,359.7" fill="none" stroke="var(--ink)" stroke-width="13.5" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M300,359.7 L300,513.3" fill="none" stroke="var(--ink)" stroke-width="11.6" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M300,513.3 L300,559.3" fill="none" stroke="var(--ink)" stroke-width="4.6" stroke-linecap="butt" stroke-linejoin="round"/>
</g></g>
<text x="26" y="42" class="t-title ov" text-anchor="start">Streamer, sink tip</text>
<text x="26" y="70" class="t-sub ov" text-anchor="start">6–7 wt  ·  6 ft leader  ·  2 sections</text>
<text x="258" y="130" class="t-end ov" text-anchor="end">FLY LINE</text>
<text x="258" y="156" class="t-sub ov" text-anchor="end">Floating with sinking</text>
<text x="258" y="179" class="t-sub ov" text-anchor="end">tip</text>
<g class="ov"><ellipse cx="300" cy="173" rx="12" ry="19" fill="none" stroke="var(--ink)" stroke-width="4"/>
<ellipse cx="300" cy="195" rx="12" ry="19" fill="none" stroke="var(--ink)" stroke-width="4"/>
<path d="M288,180 A12,19 0 0 0 312,180" fill="none" stroke="var(--bg)" stroke-width="5"/></g>
<text x="336" y="190" class="t-knot ov" text-anchor="start">Loop to loop</text>
<text x="258" y="278.8" class="t-spec ov" text-anchor="end">3 ft · 15 lb</text>
<text x="258" y="302.8" class="t-sub ov" text-anchor="end">Mono butt</text>
<g class="ov"><circle cx="300" cy="359.6743371481683" r="7.5" fill="var(--bg)"/><circle cx="300" cy="359.6743371481683" r="5.5" fill="var(--ink)"/></g>
<text x="336" y="365.7" class="t-knot ov" text-anchor="start">Blood knot</text>
<text x="258" y="432.5" class="t-spec ov" text-anchor="end">3 ft · 10 lb</text>
<text x="258" y="456.5" class="t-sub ov" text-anchor="end">Fluorocarbon tippet</text>
<g class="ov"><circle cx="300" cy="513.3486742963366" r="7.5" fill="var(--bg)"/><circle cx="300" cy="513.3486742963366" r="5.5" fill="var(--ink)"/></g>
<text x="336" y="519.3" class="t-knot ov" text-anchor="start">Non-slip mono loop</text>
<g transform="translate(294,559.3486742963366) scale(0.9)"><g class="art"><circle cx="0" cy="0" r="11" fill="none" stroke="var(--ink-2)" stroke-width="4.4"/>
