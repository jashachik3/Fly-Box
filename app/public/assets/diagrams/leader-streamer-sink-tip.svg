<path d="M50,0 C53.3,0.7 65.7,0 70,4 C74.3,8 78,19 76,24 C74,29 63.7,33.7 58,34 C52.3,34.3 45.2,29.5 42,26 C38.8,22.5 39.5,15.2 39,13" fill="none" stroke="var(--ink-2)" stroke-width="4.4" stroke-linecap="round"/></g></g>
<text x="258" y="565.3" class="t-end ov" text-anchor="end">SINGLE</text>
<text x="258" y="589.3" class="t-sub ov" text-anchor="end">Loop knot so it swims.</text>
<text x="26" y="683.3" class="t-cap ov" text-anchor="start">When: Off-color water, low light, big browns.</text>
<text x="26" y="734.3" class="t-knot ov" text-anchor="start">Not to scale — lengths are on the labels.</text>
