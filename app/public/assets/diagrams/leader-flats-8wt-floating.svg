<text x="258" y="973.6" class="t-end ov" text-anchor="end">SINGLE</text>
<text x="258" y="997.6" class="t-sub ov" text-anchor="end">One fly. Eye weight is the</text>
<text x="258" y="1018.6" class="t-sub ov" text-anchor="end">depth decision.</text>
<text x="26" y="1091.6" class="t-cap ov" text-anchor="start">When: Calm to light wind, skinny water, spooky fish. Lengthen</text>
