<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1191.6433028713413" width="730" height="1191.6433028713413" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Flats 8-weight, floating — leader diagram</title>
<desc id="d">Leader schematic for Flats 8-weight, floating: 5 ft · 40 lb Hard mono butt, then 2 ft · 30 lb Hard mono, then 1.5 ft · 25 lb Hard mono, then 1.5 ft · 20 lb Hard mono, then 2 ft · 16 lb Fluorocarbon tippet.</desc>
<style>
  :root {
    --bg: #ffffff;
    --ink: #17211c;
    --ink-2: #4a5852;
    --ink-3: #5a6a63;
    --rule: #d2dad3;
    --strand-b: #14605b;
    --action: #9c4514;
    --sighter: #b8860b;
    --panel: #f7f9f6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141c18;
      --ink: #e4eae5;
      --ink-2: #a5b2ab;
      --ink-3: #7a8781;
      --rule: #263229;
      --strand-b: #5fc6b8;
      --action: #e4864b;
      --sighter: #d8a93a;
      --panel: #1a231e;
    }
  }

  text {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    fill: var(--ink);
  }
  .t-spec { font-size: 21px; font-weight: 600; }
  .t-sub { font-size: 18px; fill: var(--ink-2); }
  .t-knot { font-size: 18px; font-style: italic; fill: var(--ink-3); }
  .t-cap { font-size: 20px; fill: var(--ink-2); }
  .t-end { font-size: 17px; font-weight: 700; letter-spacing: 0.09em; fill: var(--ink-3); }
  .t-title { font-size: 30px; font-weight: 700; }
  .t-badge { font-size: 23px; font-weight: 700; fill: var(--bg); }
  .t-count { font-size: 19px; font-weight: 700; fill: var(--action); }
  /* A panel backed by a rendered image drops its own line work and keeps its
     text, numbers and arrows. Per-panel, so a half-generated set still reads. */
  .has-img .art { display: none }
</style>
