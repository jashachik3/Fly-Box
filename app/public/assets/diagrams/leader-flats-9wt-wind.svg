    --ink: #17211c;
    --ink-2: #4a5852;
    --ink-3: #5a6a63;
    --rule: #d2dad3;
    --strand-b: #14605b;
    --action: #9c4514;
    --sighter: #b8860b;
    --panel: #f7f9f6;
  }

