<title id="t">Flats 9-weight, wind — leader diagram</title>
<desc id="d">Leader schematic for Flats 9-weight, wind: 4 ft · 40 lb Hard mono butt, then 1.5 ft · 30 lb Hard mono, then 1 ft · 25 lb Hard mono, then 1 ft · 20 lb Hard mono, then 1.5 ft · 16 lb Fluorocarbon tippet.</desc>
<style>
